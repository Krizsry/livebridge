# =============================================================================
# Live Bridge - full stack
# =============================================================================
# Bring up with:   docker compose up -d --build
# Project name:    livebridge   (set in .env as COMPOSE_PROJECT_NAME, or via -p)
#
# PUBLISHED PORTS - exactly three, nothing else (project rule 2):
#   9000/udp  SRT ingest + playback
#   1935/tcp  RTMP ingest + playback
#   443/tcp   Dashboard over HTTPS
#
# Everything else - the SRS HTTP API (1985), SRS's HLS server (8080), the
# backend (8000) and the dashboard's static server (8080) - is reachable ONLY on
# the internal livebridge_net bridge network.
#
# There is NO application-level login on the dashboard (requirement 12), so
# restrict 443 with a firewall or a VPN. See the README security section.
# =============================================================================

name: livebridge

services:
  # ---------------------------------------------------------------------------
  # SRS - the streaming engine. Handles SRT and RTMP ingest and HLS output.
  # This is the only component that must never go down; it has no dependency on
  # the backend, Supabase or the dashboard.
  # ---------------------------------------------------------------------------
  srs:
    build:
      context: ./srs
      dockerfile: Dockerfile
    container_name: livebridge_srs
    hostname: livebridge_srs
    restart: unless-stopped
    env_file: [.env]
    environment:
      SRT_PASSPHRASE: ${SRT_PASSPHRASE:?SRT_PASSPHRASE must be set in .env}
      SRT_PBKEYLEN: ${SRT_PBKEYLEN:-16}
      SRT_LATENCY_MS: ${SRT_LATENCY_MS:-300}
      HLS_FRAGMENT_SEC: ${HLS_FRAGMENT_SEC:-2}
      HLS_WINDOW_SEC: ${HLS_WINDOW_SEC:-12}
      SRS_LOG_LEVEL: ${SRS_LOG_LEVEL:-trace}
    ports:
      # SRT ingest. UDP - a common deployment mistake is publishing this as TCP.
      - "${SRT_BIND_ADDR:-0.0.0.0}:${HOST_SRT_PORT:-9000}:9000/udp"
      # RTMP ingest.
      - "${RTMP_BIND_ADDR:-0.0.0.0}:${HOST_RTMP_PORT:-1935}:1935/tcp"
    networks:
      livebridge_net:
        # SRS's HTTP parser rejects any request whose Host header contains an
        # underscore (invalid in a hostname per RFC 1123), answering with an
        # empty reply and closing the socket. The container is named
        # livebridge_srs, so anything addressing it by that name over HTTP -
        # the backend's SRS API client - fails every call. This hyphenated
        # alias is the name all HTTP callers must use.
        aliases: [livebridge-srs]
    healthcheck:
      # The ossrs/srs image ships no curl, wget, nc or python, so the probe talks
      # HTTP to the SRS API over bash's /dev/tcp instead. This keeps rule 14
      # intact - no package is installed purely to support a healthcheck - and it
      # verifies a real 200 from the API rather than just an open TCP port.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/1985 && printf "GET /api/v1/versions HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    # SRS writes HLS segments continuously; keeping them on a tmpfs avoids
    # thrashing the disk and guarantees they are cleaned up on restart.
    tmpfs:
      - /usr/local/srs/objs/nginx/html:size=2g,mode=1777
    security_opt: [no-new-privileges:true]

  # ---------------------------------------------------------------------------
  # Backend - SRS callback handler, REST API, WebSocket hub, FFmpeg relay
  # manager and Supabase client.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livebridge_backend
    hostname: livebridge_backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      BACKEND_PORT: 8000
      # Must be the hyphenated alias, not the container name - see the alias
      # comment on the srs service above.
      SRS_API_URL: http://livebridge-srs:1985
      SRS_HTTP_URL: http://livebridge-srs:8080
      SRS_INTERNAL_RTMP: rtmp://livebridge-srs:1935
      SRS_INTERNAL_SRT_HOST: livebridge-srs
    networks:
      livebridge_net:
        # SRS calls the backend's http_hooks as an HTTP client, and its parser
        # rejects hostnames containing underscores. With on_connect failing,
        # SRS refuses every RTMP and SRT publish. The SRS config must address
        # the backend by this hyphenated alias.
        aliases: [livebridge-backend]
    depends_on:
      srs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    security_opt: [no-new-privileges:true]

  # ---------------------------------------------------------------------------
  # Dashboard - static React bundle. No secrets, no Supabase access.
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: livebridge_dashboard
    hostname: livebridge_dashboard
    restart: unless-stopped
    networks: [livebridge_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/_health || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: [no-new-privileges:true]

  # ---------------------------------------------------------------------------
  # Nginx - TLS termination and the only publicly reachable HTTP surface.
  # Runs unprivileged and listens on 8443 inside the container, so no process
  # ever needs root to bind a low port (project rule 3). The host maps 443.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: livebridge_nginx
    hostname: livebridge_nginx
    restart: unless-stopped
    ports:
      - "${HTTPS_BIND_ADDR:-0.0.0.0}:${HOST_HTTPS_PORT:-443}:8443/tcp"
    volumes:
      - ./nginx/livebridge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [livebridge_net]
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      # Nginx proxies /hls/ and /live/ straight to SRS. Without this, a cold start
      # could bring nginx up first and serve 502s on both for as long as SRS took
      # to become healthy - with a completely valid config, which is the hardest
      # kind of failure to diagnose (#19).
      srs:
        condition: service_healthy
    healthcheck:
      # -k because the default cert is self-signed until you install a real one.
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:8443/_health || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    security_opt: [no-new-privileges:true]

networks:
  livebridge_net:
    name: livebridge_net
    driver: bridge
