# =============================================================================
# Live Bridge - public reverse proxy (TLS termination)
# =============================================================================
# This is the ONLY publicly reachable HTTP surface. It fronts:
#   /            -> livebridge_dashboard:8080   (React bundle)
#   /api/        -> livebridge_backend:8000     (REST API)
#   /ws          -> livebridge_backend:8000     (WebSocket, live metrics)
#   /hls/        -> livebridge_srs:8080         (HLS playlists + segments)
#   /live/       -> livebridge_srs:8080         (HTTP-FLV low-latency preview)
#
# Runs in nginx-unprivileged, so it listens on 8080/8443 and the host maps 443.
#
# IMPORTANT: there is no application-level login (requirement 12). Anyone who
# can reach this port can add relay destinations and disable stream keys.
# Restrict it with a host firewall or a VPN - see the README. An optional IP
# allowlist is included below, commented out.
# =============================================================================

# --- Structured JSON access logging (project rule 9) -------------------------
log_format livebridge_json escape=json
    '{'
    '"ts":"$time_iso8601",'
    '"level":"info",'
    '"service":"nginx",'
    '"event":"dashboard_access",'
    '"source_ip":"$remote_addr",'
    '"forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"duration_ms":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"tls_protocol":"$ssl_protocol",'
    '"tls_cipher":"$ssl_cipher"'
    '}';

# --- Upstream resolution ------------------------------------------------------
# There are deliberately NO `upstream` blocks here, and that is the fix for a
# real outage. nginx resolves an upstream's hostname exactly ONCE, at config
# load. Rebuilding a container gives it a new IP, Docker hands the freed address
# to some other container, and nginx keeps proxying to the stale IP - silently
# serving requests from the WRONG SERVICE. It surfaced as `https://localhost/`
# returning 404 (SRS answering dashboard requests) while the dashboard container
# itself returned 200. Note the failure mode: a 404, not a 502, with nginx still
# reporting healthy. Nothing looked broken.
#
# Using Docker's embedded DNS (127.0.0.11) plus a VARIABLE in proxy_pass forces
# nginx to re-resolve per request, honouring `valid=10s`, so a rebuilt container
# is picked up automatically and no reload is needed.
#
# TRADEOFF, accepted knowingly: variable proxy_pass cannot use an upstream block,
# so we lose connection keepalive and the max_fails/fail_timeout passive health
# checks. For four services on one host that is a fair price for not silently
# routing traffic into the wrong container. If keepalive ever matters more than
# this, the alternative is to reload nginx after every rebuild - which is a
# manual step nobody remembers under pressure.
resolver 127.0.0.11 valid=10s ipv6=off;

# -----------------------------------------------------------------------------
# Plain HTTP -> HTTPS redirect. DISABLED, and it is important to understand why
# rather than re-enabling it and expecting a redirect.
#
# This block can never fire in the Compose deployment: docker-compose.yml
# publishes 443:8443 only, so nothing on the host or the network can reach the
# container's 8080. Left live, it was dead config that read like a working
# redirect - someone typing http://<host>/ would get a connection refused and
# have no reason to suspect the redirect existed at all.
#
# To actually use it you must publish port 80 as well, e.g.
#     - "${HTTP_BIND_ADDR:-0.0.0.0}:80:8080/tcp"
# That is a PORT EXPOSURE change and needs explicit sign-off under project
# rule 11 - it is deliberately not done here.
# -----------------------------------------------------------------------------
# server {
#     listen      8080;
#     server_name _;
#
#     access_log /dev/stdout livebridge_json;
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

# -----------------------------------------------------------------------------
# HTTPS
# -----------------------------------------------------------------------------
server {
    listen              8443 ssl;
    http2               on;
    server_name         _;

    server_tokens       off;

    access_log /dev/stdout livebridge_json;
    error_log  /dev/stderr warn;

    # --- TLS ------------------------------------------------------------------
    # Replace these with a real certificate for production. scripts/gen-selfsigned-cert.sh
    # produces a self-signed pair so the stack starts on first boot; the README
    # covers swapping in Let's Encrypt.
    ssl_certificate     /etc/nginx/certs/livebridge.crt;
    ssl_certificate_key /etc/nginx/certs/livebridge.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:LiveBridgeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers -----------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"          always;
    add_header X-Frame-Options          "SAMEORIGIN"       always;
    add_header Referrer-Policy          "no-referrer"      always;
    # No app-level auth means we should at least keep the page out of caches and
    # out of any embedding context that could clickjack the destination controls.
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    # HSTS is commented out because it is hard to undo and will break access if
    # you later need plain HTTP on this hostname. Enable once you have a real cert.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- OPTIONAL IP ALLOWLIST ------------------------------------------------
    # STRONGLY RECOMMENDED, since there is no login. Uncomment and set your
    # office/VPN ranges. Everything else gets a 403 before it reaches the app.
    #
    # allow 10.8.0.0/24;        # VPN subnet
    # allow 203.0.113.0/24;     # office static range
    # deny  all;
    # --------------------------------------------------------------------------

    client_max_body_size 1m;

    # Held in variables so proxy_pass re-resolves per request - see the resolver
    # note at the top of this file. SRS is addressed by its HYPHENATED alias:
    # SRS 6.x rejects underscores in the Host header (RFC 1123) and answers with
    # an empty reply, so `livebridge_srs` must never be used for HTTP.
    set $up_dashboard livebridge_dashboard:8080;
    set $up_backend   livebridge_backend:8000;
    set $up_srs       livebridge-srs:8080;

    # Cookies are not port- or scheme-scoped, so a browser that has accumulated
    # cookies from other apps on the same hostname (very common on "localhost")
    # sends all of them here too. The default 8k header buffer overflows and the
    # request dies with "400 Request Header Or Cookie Too Large" - and because
    # this proxy speaks HTTP/2 to the client but HTTP/1.1 upstream, the 400 comes
    # back from the *upstream* container, not from here, which makes it look like
    # the dashboard is broken. Give headers room at the edge; the Cookie header
    # itself is then dropped per-location below.
    large_client_header_buffers 8 32k;

    # --- Dashboard (static bundle) -------------------------------------------
    location / {
        # No URI part after the variable, so the original request URI is passed
        # through unchanged - same behaviour as the previous upstream form.
        proxy_pass         http://$up_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # A static file server has no use for a cookie. Dropping it stops any
        # client-side cookie bloat from ever reaching the dashboard container.
        proxy_set_header   Cookie            "";
    }

    # --- REST API -------------------------------------------------------------
    location /api/ {
        # SRS calls its hooks over the internal network, never through here.
        # Block the hook paths from the public side so nothing external can
        # forge a publish authorisation or a session record.
        location /api/hooks/ {
            deny all;
        }

        proxy_pass         http://$up_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # There is no app-level login (requirement 12), so the API never reads a
        # cookie. Dropping it keeps Node's own header limit out of the picture.
        proxy_set_header   Cookie            "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        add_header Cache-Control "no-store" always;
    }

    # --- WebSocket (live metrics) --------------------------------------------
    # Exact match, not a prefix. As a prefix, `/ws` also captured /wsfoo, /ws-test
    # and anything else sharing the first three characters, proxying it to the
    # backend where the WebSocket server (path: '/ws') would refuse the upgrade
    # anyway. There is exactly one WebSocket endpoint, so pin it.
    location = /ws {
        proxy_pass         http://$up_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The hub sends a frame every second and pings every 30 s; a long read
        # timeout stops nginx cutting an idle-but-healthy socket.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # --- HLS output (browser preview) ----------------------------------------
    location /hls/ {
        # A variable in proxy_pass cannot carry the prefix-stripping trailing
        # slash, so the strip is done explicitly with a rewrite instead. Same net
        # effect as the old "proxy_pass http://upstream/;":
        # /hls/live/<stream>.m3u8 -> SRS /live/<stream>.m3u8
        rewrite            ^/hls/(.*)$ /$1 break;
        proxy_pass         http://$up_srs;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   Connection "";

        # Playlists must not be cached or the player replays stale segments.
        #
        # These nested blocks must repeat proxy_http_version/Connection: nginx does
        # NOT inherit them from the parent location, and without them each segment
        # request falls back to HTTP/1.0 with `Connection: close` - a brand new TCP
        # connection per .ts file, which at a 2 s fragment is a connection every two
        # seconds per viewer.
        location ~ \.m3u8$ {
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://$up_srs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header Cache-Control "no-cache, no-store" always;
            add_header Access-Control-Allow-Origin "$http_origin" always;
        }
        # Segments are immutable once written.
        location ~ \.ts$ {
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://$up_srs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # NO `expires` here. `expires` emits its own Cache-Control, so pairing it
            # with an explicit add_header sent TWO Cache-Control headers on every
            # segment. Which one a cache honours is not something to leave to chance -
            # the explicit header is the one we want, so `expires` is gone.
            add_header Cache-Control "public, max-age=600" always;
            add_header Access-Control-Allow-Origin "$http_origin" always;
        }
    }

    # --- HTTP-FLV (lower-latency preview) ------------------------------------
    location /live/ {
        # Trailing "/" (not "/live/") so the location prefix is STRIPPED, matching the
        # /hls/ block above. SRS mounts HTTP-FLV at [app]/[stream].flv, so the public
        # URL is /live/<app>/<stream>.flv -> SRS /<app>/<stream>.flv.
        # With "/live/" here the app segment was doubled and every advertised
        # flv_url (/live/live/<key>.flv) returned 404 while /live/<key>.flv worked -
        # which also hardcoded the app to "live" and broke any other app name.
        # The strip is now an explicit rewrite because a variable proxy_pass
        # cannot carry the trailing slash - same result, re-resolvable upstream.
        rewrite            ^/live/(.*)$ /$1 break;
        proxy_pass         http://$up_srs;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;

        # ---------------------------------------------------------------------
        # HLS served under /live/ - passed through WITHOUT the prefix strip.
        #
        # This is not redundancy with the /hls/ block above; it is the fix for a
        # broken playback chain. SRS answers /live/<stream>.m3u8 with a MASTER
        # playlist whose only entry is an ABSOLUTE path in SRS's own URL space:
        #
        #     /live/<stream>.m3u8?hls_ctx=<token>
        #
        # A player resolves that against the page origin, so it arrives here, at
        # /live/ - the HTTP-FLV location - which strips its prefix and asks SRS
        # for /<stream>.m3u8. SRS has nothing mounted there, so it 404s and
        # playback dies on the SECOND hop.
        #
        # The advertised entry point /hls/live/<stream>.m3u8 returns 200 the
        # whole time, because the first hop is fine. That 200 is exactly what
        # made this look healthy: checking it proves only that the master
        # playlist exists, never that the player can follow it. The media
        # playlist then uses RELATIVE segment names (<stream>-<n>.ts?hls_ctx=…),
        # which resolve back into /live/ too - so segments need the same
        # treatment as the playlist.
        #
        # No rewrite here, so both the path and the hls_ctx query string reach
        # SRS untouched. .flv does not match this block and keeps stripping, so
        # the advertised flv_url (/live/<app>/<stream>.flv) is unaffected.
        # ---------------------------------------------------------------------
        location ~ ^/live/.+\.(m3u8|ts)$ {
            proxy_pass         http://$up_srs;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   Connection "";
            add_header Access-Control-Allow-Origin "$http_origin" always;
        }
    }

    # --- Health ---------------------------------------------------------------
    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
