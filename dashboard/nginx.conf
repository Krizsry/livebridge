# =============================================================================
# Live Bridge - dashboard static file server (inside the livebridge_dashboard
# container). This is NOT the public-facing proxy; that is nginx/livebridge.conf.
#
# Runs unprivileged on 8080 and is reachable only on the internal Docker
# network - it is never published to the host.
# =============================================================================
# Structured JSON access logging (project rule 9).
# This MUST sit at http level, not inside the server block: this file is
# included from within http {}, and nginx rejects log_format anywhere else with
# "directive is not allowed here".
log_format livebridge_json escape=json
    '{'
    '"ts":"$time_iso8601",'
    '"level":"info",'
    '"service":"dashboard",'
    '"event":"static_request",'
    '"source_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration_ms":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
    '}';

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Trim the server banner.
    server_tokens off;

    access_log /dev/stdout livebridge_json;
    error_log  /dev/stderr warn;

    # Hashed asset filenames - safe to cache hard.
    # NO `expires` here: it emits its own Cache-Control, so pairing it with an
    # explicit add_header sent TWO Cache-Control headers on every asset. max-age
    # is stated inline instead, so there is exactly one and it says what we mean.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Brand assets copied verbatim from public/. Their filenames are NOT content
    # hashed the way /assets/ is, so they must not be cached immutably: a day is
    # long enough to keep them off the wire on repeat loads, short enough that
    # re-running scripts/gen-logo-assets.ps1 reaches clients without asking the
    # operator for a hard reload. Regex locations are matched before the prefix
    # location / below, so these win.
    location ~* ^/(favicon\.png|livebridge-[a-z0-9-]+\.png)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # index.html must never be cached, or a redeploy leaves clients on the old
    # bundle pointing at assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container healthcheck target.
    location = /_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
